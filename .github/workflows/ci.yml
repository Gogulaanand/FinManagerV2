name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build / test / lint / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout=300000 --fetch-retries=5

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test

      - name: Independent inactivity watchdog tests
        run: node --test scripts/check-deadman-health.test.mjs

      - name: Backup verification tests
        run: python3 scripts/test_verify_backup.py

      - name: Edge Function typecheck
        run: pnpm dlx deno@2.9.6 check --config supabase/functions/deadman-check/deno.json supabase/functions/deadman-check/index.ts

      - name: Server and access helper tests
        run: pnpm test:server

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Formatting
        run: pnpm format:check

  playwright:
    name: Playwright critical paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: phase9-e2e-dedicated-account
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_POWERSYNC_URL: ${{ secrets.NEXT_PUBLIC_POWERSYNC_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout=300000 --fetch-retries=5

      - name: Build web workspace dependencies
        run: pnpm turbo run build --filter=@finmanager/web^...

      - name: Install Chromium
        run: pnpm --filter @finmanager/web exec playwright install --with-deps chromium

      - name: Seed deterministic account
        run: pnpm --filter @finmanager/web e2e:seed

      - name: Run Playwright
        run: pnpm --filter @finmanager/web e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  database:
    name: Fresh migrations and database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild from migrations
        run: node scripts/test-l3-1-fresh-migration.mjs
      - name: Verify database behavior and tenant isolation
        run: supabase test db --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
