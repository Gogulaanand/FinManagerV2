name: Supabase monthly restore rehearsal

on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Successful supabase-backup run ID (blank uses the latest successful run)'
        required: false
        type: string

concurrency:
  group: supabase-restore-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    name: Restore the latest encrypted backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      DISPOSABLE_SUPABASE_DB_URL: ${{ secrets.DISPOSABLE_SUPABASE_DB_URL }}
      SUPABASE_BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
      BACKUP_RUN_ID_INPUT: ${{ inputs.backup_run_id }}

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Validate rehearsal configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${DISPOSABLE_SUPABASE_DB_URL:?DISPOSABLE_SUPABASE_DB_URL is required}"
          : "${SUPABASE_BACKUP_PASSPHRASE:?SUPABASE_BACKUP_PASSPHRASE is required}"
          if (( ${#SUPABASE_BACKUP_PASSPHRASE} < 32 )); then
            echo 'SUPABASE_BACKUP_PASSPHRASE must be at least 32 characters.' >&2
            exit 1
          fi

      - name: Select a successful backup run
        id: backup-run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$BACKUP_RUN_ID_INPUT"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow supabase-backup.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo 'No successful Supabase backup run was found.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the encrypted backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ steps.backup-run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup-artifact"
          gh run download "$BACKUP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "supabase-logical-backup-${BACKUP_RUN_ID}" \
            --dir "$RUNNER_TEMP/backup-artifact"
          mapfile -t encrypted_files < <(find "$RUNNER_TEMP/backup-artifact" -type f -name '*.gpg' -print)
          if (( ${#encrypted_files[@]} != 1 )); then
            echo 'Expected exactly one encrypted backup artifact.' >&2
            exit 1
          fi
          printf 'encrypted_path=%s\n' "${encrypted_files[0]}" >> "$GITHUB_ENV"

      - name: Decrypt and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/restore"
          passphrase_file="$RUNNER_TEMP/restore/passphrase"
          archive="$RUNNER_TEMP/restore/backup.tar.gz"
          printf '%s' "$SUPABASE_BACKUP_PASSPHRASE" > "$passphrase_file"
          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --decrypt \
            --output "$archive" \
            "$encrypted_path"
          tar -xzf "$archive" -C "$RUNNER_TEMP/restore"
          (cd "$RUNNER_TEMP/restore" && sha256sum --check checksums.sha256)
          rm -f "$passphrase_file" "$archive"

      - name: Restore schema and data into the disposable project
        shell: bash
        run: |
          set -euo pipefail
          psql \
            --dbname "$DISPOSABLE_SUPABASE_DB_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file "$RUNNER_TEMP/restore/schema.sql" \
            --file "$RUNNER_TEMP/restore/data.sql"

      - name: Record restore smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          table_count="$(psql \
            --dbname "$DISPOSABLE_SUPABASE_DB_URL" \
            --tuples-only \
            --no-align \
            --command "select count(*) from information_schema.tables where table_schema = 'public'")"
          account_row_count="$(psql \
            --dbname "$DISPOSABLE_SUPABASE_DB_URL" \
            --tuples-only \
            --no-align \
            --command "select count(*) from public.accounts")"
          {
            echo '### Supabase restore rehearsal'
            echo
            echo "- Backup run: ${{ steps.backup-run.outputs.run_id }}"
            echo "- Rehearsal run: $GITHUB_RUN_ID"
            echo "- Public table count: $table_count"
            echo "- Account row count: $account_row_count"
            echo '- Encrypted artifact checksum and schema/data restore completed successfully.'
            echo '- roles.sql is retained in the encrypted artifact; managed Supabase roles are restored manually during a project-loss recovery.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decrypted restore material
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/restore" "$RUNNER_TEMP/backup-artifact"
