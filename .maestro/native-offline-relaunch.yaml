appId: ${APP_ID}
name: Native encrypted offline relaunch persistence
tags:
  - native
  - offline
---
- launchApp:
    clearState: true
- runFlow: login.yaml
- tapOn: 'Expenses'
- setAirplaneMode: enabled
- tapOn: 'Add transaction'
- assertVisible: 'New transaction'
- tapOn: '9'
- tapOn: '8'
- tapOn: '7'
- tapOn: 'e.g. Swiggy'
- inputText: 'Maestro Offline Relaunch'
- hideKeyboard
- scrollUntilVisible:
    element: 'Save transaction'
    direction: DOWN
- tapOn: 'Save transaction'
- assertVisible: 'Maestro Offline Relaunch'
- killApp
- launchApp:
    stopApp: false
- tapOn: 'Expenses'
- assertVisible: 'Maestro Offline Relaunch'
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: 'Maestro Offline Relaunch'
    timeout: 30000
