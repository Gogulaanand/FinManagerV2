appId: ${APP_ID}
name: Add an expense offline-first
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow: login.yaml
- tapOn: 'Expenses'
- tapOn: 'Add transaction'
- assertVisible: 'New transaction'
- tapOn: '2'
- tapOn: '7'
- tapOn: '5'
- tapOn: 'e.g. Swiggy'
- inputText: 'Maestro Phase9'
- hideKeyboard
- scrollUntilVisible:
    element: 'Save transaction'
    direction: DOWN
- tapOn: 'Save transaction'
- assertVisible: 'Maestro Phase9'
